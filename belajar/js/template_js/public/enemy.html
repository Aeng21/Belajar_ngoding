<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Enemy</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background: #f4f4f4; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; }
    h2 { margin-top: 0; }
    form#formTambah { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    form#formTambah input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; min-width: 120px; }
    form#formTambah button { padding: 8px 16px; background: #28a745; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f2f2f2; }
    .action-btn { padding: 4px 10px; margin: 0 4px; border: none; border-radius: 4px; cursor: pointer; }
    .edit-btn { background: #007bff; color: #fff; }
    .delete-btn { background: #dc3545; color: #fff; }
    .edit-btn:hover { background: #0056b3; }
    .delete-btn:hover { background: #c82333; }
    #backLink { display: inline-block; margin-top: 20px; color: #007bff; text-decoration: none; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      width: 400px;
      max-width: 90%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      position: relative;
    }
    .modal-card h3 { margin-top: 0; margin-bottom: 20px; color: #333; }
    .modal-card .form-group { margin-bottom: 15px; }
    .modal-card .form-group label { display: block; margin-bottom: 4px; font-weight: bold; }
    .modal-card .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .modal-card .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .modal-card .modal-actions button { padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; }
    .modal-card .modal-actions .btn-save { background: #28a745; color: #fff; }
    .modal-card .modal-actions .btn-cancel { background: #6c757d; color: #fff; }
    .modal-card .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #aaa; }
    .modal-card .close-btn:hover { color: #000; }
  </style>
</head>
<body>
  <div class="container">
    <h2>👹 Data Enemy</h2>

    <form id="formTambah">
      <input type="text" id="namaTambah" placeholder="Nama" required />
      <input type="text" id="difTambah" placeholder="Difficulty" required />
      <input type="number" id="healthTambah" placeholder="Health" required />
      <button type="submit">Tambah</button>
    </form>

    <table>
      <thead>
        <tr><th>ID</th><th>Nama</th><th>Difficulty</th><th>Health</th><th>Aksi</th></tr>
      </thead>
      <tbody id="tbodyEnemy"></tbody>
    </table>

    <a href="index.html" id="backLink">← Kembali ke Beranda</a>
  </div>

  <!-- MODAL EDIT -->
  <div class="modal-overlay" id="modalEdit">
    <div class="modal-card">
      <span class="close-btn" id="modalClose">&times;</span>
      <h3>Edit Enemy</h3>
      <form id="formEdit">
        <div class="form-group"><label for="editNama">Nama</label><input type="text" id="editNama" required /></div>
        <div class="form-group"><label for="editDif">Difficulty</label><input type="text" id="editDif" required /></div>
        <div class="form-group"><label for="editHealth">Health</label><input type="number" id="editHealth" required /></div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="btnCancelEdit">Batal</button>
          <button type="submit" class="btn-save">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/api/enemy';

    const formTambah = document.getElementById('formTambah');
    const namaTambah = document.getElementById('namaTambah');
    const difTambah = document.getElementById('difTambah');
    const healthTambah = document.getElementById('healthTambah');
    const tbody = document.getElementById('tbodyEnemy');

    const modalOverlay = document.getElementById('modalEdit');
    const formEdit = document.getElementById('formEdit');
    const editNama = document.getElementById('editNama');
    const editDif = document.getElementById('editDif');
    const editHealth = document.getElementById('editHealth');
    const modalClose = document.getElementById('modalClose');
    const btnCancelEdit = document.getElementById('btnCancelEdit');

    let currentEditId = null;

    function openEditModal(id, nama, dif, health) {
      currentEditId = id;
      editNama.value = nama;
      editDif.value = dif;
      editHealth.value = health;
      modalOverlay.classList.add('active');
    }

    function closeEditModal() {
      modalOverlay.classList.remove('active');
      currentEditId = null;
      formEdit.reset();
    }

    modalClose.addEventListener('click', closeEditModal);
    btnCancelEdit.addEventListener('click', closeEditModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeEditModal();
    });

    async function loadData() {
      try {
        const res = await fetch(API_URL);
        const result = await res.json();
        if (result.success) renderData(result.data);
        else alert('Gagal memuat data: ' + result.message);
      } catch (error) {
        console.error('Error:', error);
        alert('Terjadi kesalahan saat memuat data.');
      }
    }

    function renderData(data) {
      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Belum ada data</td></tr>`;
        return;
      }
      let html = '';
      data.forEach(item => {
        html += `
          <tr>
            <td>${item.id}</td>
            <td>${item.nama}</td>
            <td>${item.dif}</td>
            <td>${item.health}</td>
            <td>
              <button class="action-btn edit-btn" data-id="${item.id}" data-nama="${item.nama}" data-dif="${item.dif}" data-health="${item.health}">Edit</button>
              <button class="action-btn delete-btn" data-id="${item.id}">Hapus</button>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;

      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          openEditModal(btn.dataset.id, btn.dataset.nama, btn.dataset.dif, btn.dataset.health);
        });
      });
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          deleteData(btn.dataset.id);
        });
      });
    }

    async function createData(nama, dif, health) {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nama, dif, health: parseInt(health) })
        });
        const result = await res.json();
        if (result.success) {
          alert('Data berhasil ditambahkan!');
          formTambah.reset();
          loadData();
        } else {
          alert('Gagal: ' + result.message);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Terjadi kesalahan saat menambah data.');
      }
    }

    async function updateData(id, nama, dif, health) {
      try {
        const res = await fetch(`${API_URL}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nama, dif, health: parseInt(health) })
        });
        const result = await res.json();
        if (result.success) {
          alert('Data berhasil diupdate!');
          closeEditModal();
          loadData();
        } else {
          alert('Gagal: ' + result.message);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Terjadi kesalahan saat mengupdate data.');
      }
    }

    async function deleteData(id) {
      if (!confirm('Yakin ingin menghapus data ini?')) return;
      try {
        const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        const result = await res.json();
        if (result.success) {
          alert('Data berhasil dihapus!');
          loadData();
        } else {
          alert('Gagal: ' + result.message);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Terjadi kesalahan saat menghapus data.');
      }
    }

    formTambah.addEventListener('submit', (e) => {
      e.preventDefault();
      const nama = namaTambah.value.trim();
      const dif = difTambah.value.trim();
      const health = healthTambah.value.trim();
      if (!nama || !dif || !health) {
        alert('Semua field harus diisi!');
        return;
      }
      createData(nama, dif, health);
    });

    formEdit.addEventListener('submit', (e) => {
      e.preventDefault();
      const nama = editNama.value.trim();
      const dif = editDif.value.trim();
      const health = editHealth.value.trim();
      if (!nama || !dif || !health) {
        alert('Semua field harus diisi!');
        return;
      }
      if (currentEditId === null) {
        alert('ID tidak ditemukan.');
        return;
      }
      updateData(currentEditId, nama, dif, health);
    });

    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
