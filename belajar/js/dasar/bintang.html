</head>
<body>
    <script>
        let tinggi = 5;

for (let i = 1; i <= tinggi; i++) {
    let baris = "";
    for (let j = 1; j <= i; j++) {
        baris += "*";
        
    }
    document.writeln(baris);
    document.writeln("</br>")
}

for (let k = 1; k <= tinggi; k++) {
    let baris2 = "";
    for (let l = 5; l >= k; l--) {
        baris2 += "*";
        
    }
    document.writeln(baris2);
    document.writeln("</br>")
}

for (let m = 1;m <= 3;m++) {
    let baris3 = "123"
    document.writeln(baris3)
    document.writeln("</br>")
    
}

for (let o = 1;o <= 4;o++) {
    let baris4 = "";
    for (let p= 1;p <= o;p++) {
        baris4 += p;
        
    }
    document.writeln(baris4)
    document.writeln("</br>")
}
