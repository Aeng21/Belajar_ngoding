<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const br = () => document.writeln("</br>")

        class Mahasiswa {
            constructor(nama, kelas) {
                this.nama = nama,
                    this.kelas = kelas;
            }

            sapa() {
                document.writeln(`halo nama saya ${this.nama} kelas ${this.kelas}`);
                br()
            }
        }

        const udin = new Mahasiswa("udin",3);
        const usep = new Mahasiswa("usep",3);
        udin.sapa()
        usep.sapa()


        const buah = [
            "apel",
            "jeruk",
            "mangga",
            "anggur"
        ]

        for (let index = 0; index < buah.length; index++) {
            const element = buah[index];
            document.writeln(element);
        }




    </script>
</body>

</html>
