<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form id="form" action="">
        <input id="nama" type="text" placeholder="masukan nama">
        <input id="jurusan" type="text" placeholder="masukan jurusan">
        <button type="submit">Simpan</button>
    </form>

    <ul id="list">
        <li>
            Nama : kamal<br>
            Jurusan : Sistem Infromasi
        </li>
    </ul>


    <script>
        const form = document.getElementById("form");
        const nama = document.getElementById("nama");
        const jurusan = document.getElementById("jurusan");
        const list = document.getElementById("list");

        // get
        async function getData() {
            const res = await fetch("https://localhost/todo")
            const data = res.json()

            list.innerHTML = ""

            data.forEaach(todo =>{
                list.innerHTML += `
                <li>
                    Nama : ${todo.nama}<br>
                    Jurusan : ${todo.jurusan}

                    <button onclick= "editData('${id}')">edit</button>
                    <button onclick= "deleteData('${id}')">hapus</button>
                </li>
                `
            })
            
        }


        //post
        async function addData(nama,jurusan) {
            await fetch("https://localhost/todo",{
                method : "POST",
                headers : {
                    "Content-Type" : "application.json"
                },
                body : JSON.stringify({
                    item:nama,
                    item:jurusan
                })

            })
            
        }

        //put
        async function editData(id) {
            const namaBaru = prompt("masukan nama anda")
            if (!namaBaru) return
            const jurusanBaru = prompt("masukan nama anda")
            if (!namaBaru) return

            await fetch(`https://localhost/todo/${id}`,{
                method : "PUT",
                headers : {
                    "Content-Type" : "application.json"
                },
                body : JSON.stringify({
                    item:namaBaru,
                    item:jurusanBaru
                })

            })

            getData()
            
        }

        //delete
        async function deleteData(id) {
            await fetch(`https://localhost/todo/${id}`,{
                method : "DELETE"

            })

            getData()
            
        }

        

        form.addEventListener("submit", async function(e){
            e.preventDefault()
            await addData(nama.value,jurusan.value)
            nama =""
            jurusan= ""

            getData()

        })


        getData()

        

    </script>
</body>

</html>
