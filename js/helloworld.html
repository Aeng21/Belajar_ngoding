<html>
    <head>
        <title>hello</title>
    </head>
    <body>
        <script>
        //script langsung di html + type data string
        document.writeln("hello world");
        document.writeln("</br>");

        //type data number
        document.writeln(100);
        document.writeln("</br>");
        document.writeln(1.2);
        document.writeln("</br>");
        //biner
        document.writeln(0b10101);
        
        //hexa
        document.writeln(0xFDE10A);
        document.writeln("</br>");

        //octal
        document.writeln(0o7631);
        document.writeln("</br>");

        //true false
        document.writeln("true");
        document.writeln("</br>");
        document.writeln("false");
        document.writeln("</br>");

        //menggabungkan string
        document.writeln("Ahmad " + "Musthafa " + "kamal");
        document.writeln("</br>");
        
        //textarea
        document.writeln("<textarea cols='100' rows='10'>");
        //""
        document.write("\"ahmad musthafa kamal\"");
        //enter
        document.write("\nahmad \nmusthafa \nkamal\n");
        //tab
        document.write("\tahmad musthafa kamal\n");
        //  /
        document.write("\\oheng \\kaizen");
        document.writeln("</textarea>");
        </script>
    </body>
</html>
